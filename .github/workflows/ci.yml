name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test-lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (usado por los tests) necesita
          # util.markAsUncloneable, añadido en Node 22.10 — con
          # Node 20 los tests fallan al arrancar con un error de
          # "webidl.util.markAsUncloneable is not a function",
          # nada que ver con el código de la app en sí.
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # Solo Chromium (no Firefox/WebKit, que no se usan aquí) —
      # con dependencias de sistema, ya que el runner de GitHub
      # Actions es una imagen limpia sin ellas preinstaladas.
      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      # No hace falta arrancar nada a mano — el propio
      # playwright.config.ts levanta el backend simulado y la
      # app (build + preview) automáticamente antes de los
      # tests, y los para al terminar.
      - name: Tests end-to-end
        run: npm run test:e2e

      # Si algo falla, el informe HTML con capturas y trazas
      # queda descargable desde la propia ejecución en GitHub —
      # sin necesidad de reproducirlo en local a ciegas.
      - name: Subir el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
