name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test-lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (usado por los tests) necesita
          # util.markAsUncloneable, añadido en Node 22.10 — con
          # Node 20 los tests fallan al arrancar con un error de
          # "webidl.util.markAsUncloneable is not a function",
          # nada que ver con el código de la app en sí.
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build
